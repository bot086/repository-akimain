services:
  # -------------------------------------------------------------
  # Backend: Python FastAPI + SQLite + Local File Uploads
  # -------------------------------------------------------------
  - type: web
    name: akkira-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: akkira-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DATABASE_URL
        value: "sqlite:////data/akkira.db"
      # Store uploaded photos/portraits on the persistent disk
      - key: UPLOAD_DIR
        value: "/data/uploads"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://akkira-frontend.onrender.com"

  # -------------------------------------------------------------
  # Frontend: Next.js Node Server
  # -------------------------------------------------------------
  - type: web
    name: akkira-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: akkira-backend
          property: host
